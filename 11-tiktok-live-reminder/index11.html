<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="BDU Fellowship TikTok Live program remembrance template"
    />
    <title>BDU Fellowship — TikTok Live Remembrance</title>
    <link rel="stylesheet" href="../assets/theme.css?v=20260723-b" />
    <link rel="stylesheet" href="./styles11.css?v=20260731-a" />
  </head>
  <body>
    <main
      class="poster poster--tiktok"
      aria-label="TikTok Live program remembrance"
    >
      <!-- Background layers (no photo): black base + cyan/magenta glows + chromatic halftone -->
      <div class="poster--tiktok__bg" aria-hidden="true"></div>
      <div class="poster--tiktok__pattern" aria-hidden="true"></div>
      <div class="poster--tiktok__vignette" aria-hidden="true"></div>

      <div class="poster__content poster--tiktok__content">
        <!-- Header (locked pattern): live eyebrow + pulse dot left, logo right -->
        <header class="poster--tiktok__header">
          <p class="poster--tiktok__eyebrow">Live Fundraising Program</p>
          <div class="logo-container">
            <img
              src="../assets/logo/vlm-logo.svg"
              alt="VLM BDU Fellowship logo"
            />
          </div>
        </header>

        <!-- Hero (centred, oversized): white glitch headline + magenta sticker -->
        <section class="poster--tiktok__hero" aria-labelledby="tiktok-title">
          <h1 class="poster--tiktok__title" id="tiktok-title">
            TikTok LIVE<br />PROGRAM
          </h1>
          <!-- SWAPPABLE specifier sticker (pure CSS box, overlaps the seam) -->
          <span class="poster--tiktok__sticker" aria-label="Tomorrow">
            <span class="poster--tiktok__sticker-text" aria-hidden="true"
              >Tonight</span
            >
          </span>
        </section>

        <!-- When specifier: plain day + solid cyan time pill -->
        <section class="poster--tiktok__when" aria-label="When">
          <!-- SWAPPABLE: day -->
          <span class="poster--tiktok__day">WEDNESDAY</span>
          <!-- SWAPPABLE: time -->
          <span class="poster--tiktok__time">2:30 ማታ</span>
        </section>

        <!-- SWAPPABLE: devotional motto above the footer -->
        <p class="poster--tiktok__motto">እግዚአብሔር ሁልጊዜም መልካም ነው!!!</p>

        <!-- Footer: locked script component; TikTok icon + TikTok handle -->
        <footer class="footer">
          <span><strong>BDU FELLOWSHIP</strong></span>
          <span class="footer__social">
            <img src="../assets/icons/tiktok.svg" alt="" />
            <strong>@bdu_fellowship_evasue</strong>
          </span>
        </footer>
      </div>
    </main>
  </body>
</html>
