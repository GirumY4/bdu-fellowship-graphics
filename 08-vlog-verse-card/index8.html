<!doctype html>
<html lang="am">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="BDU Fellowship vlog verse card template"
    />
    <title>BDU Fellowship — Vlog Verse</title>
    <link rel="stylesheet" href="../assets/theme.css?v=20260726-o" />
    <link rel="stylesheet" href="./styles8.css?v=20260726-a" />
  </head>
  <body>
    <main class="poster poster--vlog" aria-label="Vlog scripture verse card">
      <!-- Background layers (the cross/sunrise image + warm scrims + living glow) -->
      <div class="poster--vlog__photo" aria-hidden="true"></div>
      <div class="poster--vlog__scrim" aria-hidden="true"></div>
      <div class="poster--vlog__sun" aria-hidden="true"></div>
      <div class="poster--vlog__beam" aria-hidden="true"></div>
      <div class="poster--vlog__motes" aria-hidden="true"></div>

      <div class="poster__content poster--vlog__content">
        <!-- Right-hand text column (opens with the verse, not a generic hero) -->
        <div class="poster--vlog__text">
          <!-- SWAPPABLE: hero line (gold, embossed) -->
          <h1 class="poster--vlog__title">ጨርሶ ይምራል፤ በደልን እንዳለፈ ውሃ ይረሳዋል</h1>

          <!-- SWAPPABLE: verse body (white) -->
          <p class="poster--vlog__verse">
            ያልጠፋነው ከእግዚአብሔር ምሕረት የተነሣ ነው፤ ርኅራኄው አያልቅምና። ማለዳ ማለዳ አዲስ ነው፤ ታማኝነትህ
            ብዙ ነው።
          </p>

          <!-- SWAPPABLE: reference chip (gold-bordered) -->
          <p class="poster--vlog__ref">ሰቆቃው ኤርምያስ 3፤22-23</p>
        </div>

        <!-- Centred white logo at the foot (locked brand mark) -->
        <div class="poster--vlog__brand">
          <div class="logo-container">
            <img
              src="../assets/logo/vlm-logo.svg"
              alt="VLM BDU Fellowship logo"
            />
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
