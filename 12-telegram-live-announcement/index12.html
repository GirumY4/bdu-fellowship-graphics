<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="BDU Fellowship live Telegram program announcement template"
    />
    <title>BDU Fellowship — Live Telegram Fellowship</title>
    <link rel="stylesheet" href="../assets/theme.css?v=20260723-b" />
    <link rel="stylesheet" href="./styles12.css?v=20260801-a" />
  </head>
  <body>
    <main
      class="poster poster--tlive"
      aria-label="Live Telegram fellowship announcement"
    >
      <!-- Background: photo + Telegram broadcast rings + blue-tinted overlay -->
      <div class="poster--tlive__photo" aria-hidden="true"></div>
      <div class="poster--tlive__rings" aria-hidden="true"></div>
      <div class="poster--tlive__overlay" aria-hidden="true"></div>

      <div class="poster__content poster--tlive__content">
        <!-- Centred logo -->
        <header class="poster--tlive__header">
          <div class="logo-container">
            <img
              src="../assets/logo/vlm-logo.svg"
              alt="VLM BDU Fellowship logo"
            />
          </div>
        </header>

        <!-- LIVE-on-Telegram pill with pulsing dot -->
        <p class="poster--tlive__live">
          <span class="poster--tlive__live-dot" aria-hidden="true"></span>
          Live on Telegram
        </p>

        <!-- Centred hero -->
        <section class="poster--tlive__hero" aria-labelledby="tlive-title">
          <p class="poster--tlive__eyebrow handwritten">as always...</p>
          <h1 id="tlive-title">LIVE<br /><span>FELLOWSHIP</span></h1>
          <p class="poster--tlive__amharic amharic">በእውነተኛ ፍቅር፥ በህብረት</p>
          <p class="poster--tlive__intro amharic">
            የጭንቀት ጊዜ ሳይመጣ፣ <span>"ደስ አያሰኙኝም"</span> የምትላቸው ዓመታት ሳይደርሱ፣
            <span class="highlight-gold">በወጣትነትህ ጊዜ</span> ጣሪን ዐስብ
            <span class="verse-reference">መክብብ 12:1</span>
          </p>
        </section>

        <!-- Centred details pinned near the foot -->
        <section class="poster--tlive__details" aria-label="Meeting details">
          <div class="meta-row">
            <div class="meta-badge meta-badge--amharic">
              <img src="../assets/icons/material-symbols/event.svg" alt="" />
              <span class="amharic-text">ቅዳሜ፥ ነሐሴ 2</span>
            </div>
            <div class="meta-badge meta-badge--amharic">
              <img src="../assets/icons/material-symbols/schedule.svg" alt="" />
              <span class="amharic-text">ማታ 2:30</span>
            </div>
          </div>

          <div class="poster--tlive__join">
            <div class="poster--tlive__join-copy">
              <p class="section-title">Join the family</p>
              <!-- <p>Weekly fellowship updates and meeting links</p> -->
            </div>
            <div class="qr-block qr-block--glass poster--tlive__qr">
              <img
                src="../assets/social-media-qrcode/transparen-telegram-qrcode.png"
                alt="Telegram community QR code"
              />
              <span class="qr-block__copy">
                <strong>Join on Telegram</strong>
                <span>Scan here</span>
              </span>
            </div>
          </div>
        </section>

        <!-- Locked footer (brand left / handle right) -->
        <footer class="footer">
          <span><strong>BDU FELLOWSHIP</strong></span>
          <span class="footer__social">
            <img src="../assets/icons/telegram.svg" alt="" />
            <strong>@bdu_fellowship</strong>
          </span>
        </footer>
      </div>
    </main>
  </body>
</html>
