<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="BDU Fellowship online fellowship — tonight announcement template"
    />
    <title>BDU Fellowship — Online Fellowship Tonight</title>
    <link rel="stylesheet" href="../assets/theme.css?v=20260723-b" />
    <link rel="stylesheet" href="./styles7.css?v=20260724-a" />
  </head>
  <body>
    <main
      class="poster poster--tonight"
      aria-label="Online fellowship tonight announcement"
    >
      <!-- Background layers (no photo): diagonal two-tone + halftone + spotlight -->
      <div class="poster--tonight__bg" aria-hidden="true"></div>
      <div class="poster--tonight__pattern" aria-hidden="true"></div>
      <div class="poster--tonight__vignette" aria-hidden="true"></div>

      <div class="poster__content poster--tonight__content">
        <!-- Header: locked pattern (Latin live eyebrow + pulse dot left, logo right) -->
        <header class="poster--tonight__header">
          <p class="poster--tonight__eyebrow">Live Program</p>
          <div class="logo-container">
            <img
              src="../assets/logo/vlm-logo.svg"
              alt="VLM BDU Fellowship logo"
            />
          </div>
        </header>

        <!-- Hero (centred, oversized): all-white skewed headline + gold sticker -->
        <section class="poster--tonight__hero" aria-labelledby="tonight-title">
          <h1 class="poster--tonight__title" id="tonight-title">
            ONLINE<br />FELLOWSHIP
          </h1>
          <!-- The "tonight" specifier sticker (pure CSS box, overlaps the seam) -->
          <span class="poster--tonight__sticker" aria-label="Tonight">
            <span class="poster--tonight__sticker-text" aria-hidden="true"
              >Tonight</span
            >
          </span>
        </section>

        <!-- Today specifier (Latin, icon-less): plain day + solid time pill -->
        <section class="poster--tonight__when" aria-label="When">
          <!-- SWAPPABLE: day -->
          <span class="poster--tonight__day">SATURDAY</span>
          <!-- SWAPPABLE: time -->
          <span class="poster--tonight__time">2:30 PM</span>
        </section>

        <!-- Footer: locked script-font component (brand left / handle right) -->
        <footer class="footer">
          <span><strong>BDU FELLOWSHIP</strong></span>
          <span class="footer__social">
            <img src="../assets/icons/telegram.svg" alt="" />
            <strong>@bdu_fellowship</strong>
          </span>
        </footer>
      </div>
    </main>
  </body>
</html>
