<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="BDU Fellowship speaker announcement template"
    />
    <title>BDU Fellowship — Program Speaker</title>
    <link rel="stylesheet" href="../assets/theme.css?v=20260715-3" />
    <link rel="stylesheet" href="./styles33.css?v=20260715-b" />
  </head>
  <body>
    <main
      class="poster poster--speaker"
      aria-label="Program speaker announcement"
    >
      <div class="poster--speaker__photo" aria-hidden="true"></div>
      <div
        class="image-overlay image-overlay--primary"
        aria-hidden="true"
      ></div>

      <div class="poster__content poster--speaker__content">
        <header class="poster--speaker__header">
          <!-- <div class="header-text-group">
            <p class="eyebrow-amharic amharic">አገልጋዮች</p>
          </div> -->
          <div class="logo-container">
            <img
              src="../assets/logo/vlm-logo.svg"
              alt="VLM BDU Fellowship logo"
            />
          </div>
        </header>

        <section class="poster--speaker__hero" aria-labelledby="speaker-title">
          <p class="eyebrow poster--speaker__eyebrow handwritten">meet our</p>
          <h1 id="speaker-title">PROGRAM<br /><span>SPEAKER</span></h1>
          <p class="poster--speaker__amharic amharic">የዚህ ሳምንት አገልጋዮች</p>
        </section>

        <section class="speaker-grid" aria-label="Program speakers">
          <article class="speaker-card">
            <div class="speaker-card__portrait">
              <img
                src="../assets/images/program-speakers/speaker11.jpg"
                alt="Speaker photo placeholder"
              />
              <!-- class="speaker-portrait-placeholder" -->
            </div>
            <div class="speaker-card__body">
              <p class="speaker-card__role amharic">ምስጋና እና ጸሎት</p>
              <h2 class="speaker-card__name amharic">ዮናስ</h2>
            </div>
          </article>
          <article class="speaker-card">
            <div class="speaker-card__portrait">
              <img
                src="../assets/images/program-speakers/speaker22.jpg"
                alt="Speaker photo placeholder"
              />
            </div>
            <div class="speaker-card__body">
              <p class="speaker-card__role amharic">አምልኮ (worship)</p>
              <h2 class="speaker-card__name amharic">ተባረክ</h2>
            </div>
          </article>
          <article class="speaker-card">
            <div class="speaker-card__portrait">
              <img
                src="../assets/images/program-speakers/placeholder.png"
                alt="Speaker photo placeholder"
              />
            </div>
            <div class="speaker-card__body">
              <p class="speaker-card__role amharic">ቃል እና ትምህርት</p>
              <h2 class="speaker-card__name amharic">ፀባኦት</h2>
            </div>
          </article>
        </section>

        <!-- <section class="poster--speaker__topic" aria-label="Program topic">
          <p class="section-title eyebrow-amharic amharic">የትምህርት ርዕስ፡</p>
          <p class="poster--speaker__topic-title amharic">
            ወደ ፊት የሚያስገሰግስ<br />እምነት
          </p>
           <p class="poster--speaker__topic-copy amharic"> 
            ከእግዚአብሄር ቃል የሚገባ ግረ ላሽ እና ማበረታቻ ይጠብቃችሁ።
          </p> 
        </section> 
        -->

        <div class="poster--speaker__time meta-badge meta-badge--amharic">
          <img src="../assets/icons/material-symbols/event.svg" alt="" />
          <span class="amharic-text">ቅዳሜ · ማታ 2:30 ·</span>
          <span class="badge-social">
            <img src="../assets/icons/telegram.svg" alt="" />
            <span class="badge-social__handle">@bdu_fellowship</span>
          </span>
        </div>

        <footer class="footer">
          <span>BDU FELLOWSHIP</span>
          <span class="footer__social"
            ><img
              src="../assets/icons/telegram.svg"
              alt=""
            />@bdu_fellowship</span
          >
        </footer>
      </div>
    </main>
  </body>
</html>
