<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="BDU Fellowship Bible verse card template">
    <title>BDU Fellowship — Bible Verse Card</title>
    <link rel="stylesheet" href="../assets/theme.css?v=20260715-2">
    <link rel="stylesheet" href="./styles4.css?v=20260715">
  </head>
  <body>
    <main class="poster poster--verse" aria-label="Bible verse card">
      <div class="poster--verse__photo" aria-hidden="true"></div>
      <div class="image-overlay" aria-hidden="true"></div>

      <div class="poster__content poster--verse__content">
        <header class="poster--verse__header">
          <div class="logo-container">
            <img src="../assets/logo/vlm-logo.svg" alt="VLM BDU Fellowship logo">
          </div>
          <p class="eyebrow">Verse of the week</p>
        </header>

        <section class="poster--verse__hero" aria-labelledby="verse-title">
          <p class="poster--verse__cross" aria-hidden="true">✝</p>
          <p class="eyebrow">Together in His name</p>
          <h1 id="verse-title" class="verse-type">Gathered<br>in Grace</h1>
          <p class="poster--verse__amharic amharic">በእግዚአብሔር ፊት አንድ ሆነን</p>
        </section>

        <section class="verse-card poster--verse__card" aria-label="Bible verse">
          <p class="verse-card__quote verse-type">“For where two or three gather in my name, there am I with them.”</p>
          <p class="verse-card__translation amharic">ሁለት ወይም ሦስት በስሜ በተሰበሰቡበት ስፍራ እኔ በመካከላቸው ነኝና።</p>
          <p class="verse-card__reference">Matthew 18:20</p>
        </section>

        <footer class="footer">
          <span>WALKING TOGETHER IN CHRIST</span>
          <span class="footer__social"><img src="../assets/icons/bible-logo-svgrepo-com.svg" alt="">BDU FELLOWSHIP</span>
        </footer>
      </div>
    </main>
  </body>
</html>
