<!doctype html>
<html lang="am">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="BDU Fellowship vlog verse card — do not delay with God"
    />
    <title>BDU Fellowship — Vlog Verse (Time)</title>
    <link rel="stylesheet" href="../assets/theme.css?v=20260726-a" />
    <link rel="stylesheet" href="./styles10.css?v=20260729-a" />
  </head>
  <body>
    <main class="poster poster--clock" aria-label="Vlog scripture verse card">
      <!-- Night backdrop (no motif): indigo->black + cool moon glow + warm horizon -->
      <div class="poster--clock__bg" aria-hidden="true"></div>

      <!-- HAND #1 (behind the text): the hour hand, up-left -->

      <!-- Edge vignette (above the behind-hand, below the text) -->
      <div class="poster--clock__vignette" aria-hidden="true"></div>

      <!-- TEXT COLUMN (z-index 3): woven between the two hands -->
      <div class="poster__content poster--clock__content">
        <h1 class="poster--clock__hero" id="clock-title">
          <span class="poster--clock__hero-pre">እግዚአብሔር ጋር</span>
          <span class="poster--clock__hero-key">መቆየት</span>
        </h1>

        <p class="poster--clock__verse">
          ዋይታ ለማን ነው? ኀዘን ለማን ነው? ጠብ ለማን ነው? ጩኸት ለማን ነው? ያለ ምክንያት መቍሰል ለማን ነው?
          የዓይን ቅላት ለማን ነው? የወይን ጠጅ በመጠጣት ለሚዘገዩ አይደለምን?
        </p>

        <p class="poster--clock__ref">ምሳሌ 23፥29-30</p>

        <!-- Logo directly below the pivot / intersection point -->
        <div class="poster--clock__brand">
          <div class="logo-container">
            <img
              src="../assets/logo/vlm-logo.svg"
              alt="VLM BDU Fellowship logo"
            />
          </div>
        </div>
      </div>

      <!-- HAND #2 (in front of the text): the second hand, up-right + pivot + tick pulse -->
    </main>
  </body>
</html>
