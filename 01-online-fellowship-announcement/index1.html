<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="BDU Fellowship online fellowship announcement template"
    />
    <title>BDU Fellowship — Online Fellowship</title>
    <link rel="stylesheet" href="../assets/theme.css?v=20260715-3" />
    <link rel="stylesheet" href="./styles1.css?v=20260715-b" />
  </head>
  <body>
    <main
      class="poster poster--online"
      aria-label="Online fellowship announcement"
    >
      <div class="poster--online__photo" aria-hidden="true"></div>
      <div
        class="image-overlay image-overlay--primary"
        aria-hidden="true"
      ></div>

      <div class="poster__content poster--online__content">
        <header class="poster--online__header">
          <div class="header-text-group">
            <!-- <p class="eyebrow">Every Friday</p> -->
            <p class="eyebrow-amharic amharic">ቅዳሜ በየሳምንቱ፥</p>
          </div>
          <div class="logo-container logo-container--centered">
            <img
              src="../assets/logo/vlm-logo.svg"
              alt="VLM BDU Fellowship logo"
            />
          </div>
        </header>

        <section class="poster--online__hero" aria-labelledby="online-title">
          <p class="eyebrow poster--online__eyebrow handwritten">
            coming soon...
          </p>
          <h1 id="online-title">ONLINE<br /><span>FELLOWSHIP</span></h1>
          <p class="poster--online__amharic amharic">የመስመር ላይ ህብረት</p>
          <p class="poster--online__intro amharic">
            የጭንቀት ጊዜ ሳይመጣ፣ <span>"ደስ አያሰኙኝም"</span> የምትላቸው ዓመታት ሳይደርሱ፣
            <span class="highlight-gold">በወጣትነትህ ጊዜ፣</span> ፈጣሪህን ዐስብ።
            <span class="verse-reference">መክብብ 12:1</span>
          </p>
        </section>

        <section class="poster--online__details" aria-label="Meeting details">
          <div class="meta-row">
            <div class="meta-badge meta-badge--amharic">
              <img src="../assets/icons/material-symbols/event.svg" alt="" />
              <span class="amharic-text">ቅዳሜ፥ ሀምሌ 18</span>
            </div>
            <div class="meta-badge meta-badge--amharic">
              <img src="../assets/icons/material-symbols/schedule.svg" alt="" />
              <span class="amharic-text">ማታ 2:30</span>
            </div>
          </div>

          <div class="poster--online__join">
            <div class="poster--online__join-copy">
              <p class="section-title">Join the family</p>
              <p>
                Weekly fellowship updates and meeting links
                <img
                  src="../assets/icons/material-symbols/pointer.svg"
                  alt=""
                  class="pointer-icon"
                />
              </p>
            </div>
            <div class="qr-block qr-block--glass poster--online__qr">
              <img
                src="../assets/social-media-qrcode/transparen-telegram-qrcode.png"
                alt="Telegram community QR code"
              />
              <span class="qr-block__copy">
                <strong>Join on Telegram</strong>
                <span>Scan here</span>
              </span>
            </div>
          </div>
        </section>

        <footer class="footer">
          <span><strong>BDU FELLOWSHIP</strong></span>
          <span class="footer__social"
            ><img src="../assets/icons/telegram.svg" alt="" /><strong
              >@bdu_fellowship</strong
            ></span
          >
        </footer>
      </div>
    </main>
  </body>
</html>
