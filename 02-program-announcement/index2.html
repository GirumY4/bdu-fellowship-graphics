<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="BDU Fellowship program announcement template">
    <title>BDU Fellowship — Worship Night</title>
    <link rel="stylesheet" href="../assets/theme.css?v=20260715-3">
    <link rel="stylesheet" href="./styles2.css?v=20260715-b">
  </head>
  <body>
    <main class="poster poster--program" aria-label="Worship night program announcement">
      <div class="poster--program__photo" aria-hidden="true"></div>
      <div class="image-overlay image-overlay--soft" aria-hidden="true"></div>

      <div class="poster__content poster--program__content">
        <header class="poster--program__header">
          <div class="logo-container">
            <img src="../assets/logo/vlm-logo.svg" alt="VLM BDU Fellowship logo">
          </div>
          <p class="eyebrow">BDU Fellowship presents</p>
        </header>

        <section class="poster--program__hero" aria-labelledby="program-title">
          <p class="poster--program__script handwritten">Come as you are</p>
          <p class="eyebrow">Live program</p>
          <h1 id="program-title">WORSHIP<br><span>NIGHT</span></h1>
          <p class="poster--program__amharic amharic">የአምልኮ ምሽት</p>
          <p class="poster--program__intro">An evening of worship, prayer, and the Word—together in the presence of God.</p>
        </section>

        <section class="poster--program__event" aria-label="Event details">
          <div class="poster--program__date">
            <span>16</span>
            <div><strong>JULY</strong><small>THURSDAY</small></div>
          </div>
          <div class="poster--program__details">
            <div class="meta-badge"><img src="../assets/icons/material-symbols/schedule.svg" alt=""><span>5:00 PM</span></div>
            <div class="meta-badge"><img src="../assets/icons/material-symbols/location_on.svg" alt=""><span>BDU Main Hall</span></div>
          </div>
        </section>

        <footer class="footer">
          <span>PRAYER · WORSHIP · WORD</span>
          <span class="footer__social"><img src="../assets/icons/instagram-logo-svgrepo-com.svg" alt="">@vlm_bdu</span>
        </footer>
      </div>
    </main>
  </body>
</html>
