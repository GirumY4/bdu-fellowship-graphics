<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="BDU Fellowship TikTok Live program announcement"
    />
    <title>BDU Fellowship — TikTok Live Program</title>
    <link rel="stylesheet" href="../assets/theme.css?v=20260715-3" />
    <link rel="stylesheet" href="./styles2.css?v=20260729-a" />
  </head>
  <body>
    <main
      class="poster poster--program"
      aria-label="TikTok Live program announcement"
    >
      <div class="poster--program__photo" aria-hidden="true"></div>
      <div class="image-overlay" aria-hidden="true"></div>

      <div class="poster__content poster--program__content">
        <header class="poster--program__header">
          <div class="logo-container">
            <img
              src="../assets/logo/vlm-logo.svg"
              alt="VLM BDU Fellowship logo"
            />
          </div>
          <p class="eyebrow">BDU Fellowship fundraising</p>
        </header>

        <section class="poster--program__hero" aria-labelledby="program-title">
          <p class="poster--program__script handwritten">coming soon...</p>
          <p class="eyebrow">FUNDRAISING LIVE PROGRAM</p>
          <h1 id="program-title">
            TIKTOK LIVE<br />

            <span>PROGRAM</span>
          </h1>
          <p class="poster--program__amharic amharic">በእውነተኛ ፍቅር፥ በህብረት</p>
          <p class="poster--program__intro amharic">
            'ለዘሪ ዘርን፣ ለመብላት እንጀራን የሚሰጥ
            <span>እርሱ የምትዘሩትን አትረፍርፎ ይሰጣችኋል፤</span> የጽድቃችሁንም ፍሬ
            <span class="highlight-gold">ያበዛላችኋል።'</span>
            <span class="verse-reference">2 ቆርንቶስ 9፥10</span>
          </p>
        </section>

        <section class="poster--program__event" aria-label="Event details">
          <div class="poster--program__date">
            <span>29</span>
            <div>
              <strong>ሐምሌ</strong>
              <small>ረቡዕ</small>
            </div>
          </div>
          <div class="poster--program__details">
            <div class="meta-badge">
              <img src="../assets/icons/material-symbols/schedule.svg" alt="" />
              <span>ማታ 2:30</span>
            </div>
            <div class="meta-badge">
              <img src="../assets/icons/tiktok2.svg" alt="" />
              <span>@bdu_fellowship_evasue</span>
            </div>
          </div>
        </section>

        <footer class="footer">
          <span>PRAY · WORSHIP · WORD</span>
          <span class="footer__social">
            <img src="../assets/icons/tiktok.svg" alt="" />
            @bdu_fellowship_evasue
          </span>
        </footer>
      </div>
    </main>
  </body>
</html>
