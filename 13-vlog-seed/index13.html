<!doctype html>
<html lang="am">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="BDU Fellowship vlog — the sower's seed" />
    <title>BDU Fellowship — የዘሪዉ ዘር</title>
    <link rel="stylesheet" href="../assets/theme.css?v=20260723-b" />
    <link rel="stylesheet" href="./styles13.css?v=20260802-a" />
  </head>
  <body>
    <main class="poster poster--seed" aria-label="Vlog — the sower's seed">
      <!-- Minimal earth-night backdrop -->
      <div class="poster--seed__bg" aria-hidden="true"></div>

      <!-- NEW minimal motif: falling seeds -> sprout -> soil (no reused motifs) -->
      <svg
        class="poster--seed__motif"
        viewBox="0 0 1080 1000"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <!-- falling seeds (sparse, irregular — not a grid) -->
        <g fill="#fbbf24" opacity="0.3">
          <circle cx="238" cy="168" r="4" />
          <circle cx="352" cy="120" r="5" />
          <circle cx="540" cy="96" r="4" />
          <circle cx="716" cy="132" r="5" />
          <circle cx="846" cy="196" r="4" />
          <circle cx="160" cy="268" r="3" />
          <circle cx="906" cy="300" r="3" />
        </g>

        <!-- young sprout: stem + two leaves -->
        <g stroke="#22c55e" fill="none" stroke-linecap="round">
          <path
            d="M540 856 C 540 800, 540 760, 540 726"
            stroke-width="3"
            opacity="0.5"
          />
        </g>
        <g fill="#22c55e" opacity="0.34">
          <path
            d="M540 762 C 500 752, 470 722, 466 682 C 506 688, 534 718, 540 762 Z"
          />
          <path
            d="M540 736 C 580 726, 610 696, 614 656 C 574 662, 546 692, 540 736 Z"
          />
        </g>

        <!-- soil line -->
        <path
          d="M120 858 C 320 846, 760 846, 960 858"
          stroke="#22c55e"
          stroke-width="2"
          fill="none"
          opacity="0.35"
        />
      </svg>

      <div class="poster--seed__vignette" aria-hidden="true"></div>

      <div class="poster__content poster--seed__content">
        <!-- Centred logo -->
        <header class="poster--seed__header">
          <div class="logo-container">
            <img
              src="../assets/logo/vlm-logo.svg"
              alt="VLM BDU Fellowship logo"
            />
          </div>
        </header>

        <!-- Big two-line title: possessor white, the SEED gold -->
        <h1 class="poster--seed__title">
          <span class="poster--seed__line1">የዘሪዉ</span>
          <span class="poster--seed__line2">ዘር</span>
        </h1>
      </div>
    </main>
  </body>
</html>
