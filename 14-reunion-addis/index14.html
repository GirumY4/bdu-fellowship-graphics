<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="BDU Fellowship Addis Ababa reunion — 1 year anniversary"
    />
    <title>BDU Fellowship — Reunion · 1 Year Anniversary</title>
    <link rel="stylesheet" href="../assets/theme.css?v=20260723-b" />
    <link rel="stylesheet" href="./styles14.css?v=20260803-a" />
  </head>
  <body>
    <main
      class="poster poster--reunion"
      aria-label="Reunion one year anniversary announcement"
    >
      <!-- SWAPPABLE: save the attached group photo as reunion-group.jpg -->
      <div class="poster--reunion__photo" aria-hidden="true"></div>
      <div class="poster--reunion__overlay" aria-hidden="true"></div>
      <!-- Decorative gold brush strokes (corners) -->
      <svg
        class="poster--reunion__strokes"
        viewBox="0 0 1080 1350"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <g stroke="#fbbf24" stroke-linecap="round" fill="none">
          <path d="M-20 60 L 150 -10" stroke-width="10" opacity=".8" />
          <path d="M-20 110 L 190 10" stroke-width="6" opacity=".6" />
          <path d="M-20 160 L 210 40" stroke-width="4" opacity=".45" />
          <path d="M900 1360 L 1100 1240" stroke-width="10" opacity=".8" />
          <path d="M860 1370 L 1100 1290" stroke-width="6" opacity=".6" />
          <path d="M940 1350 L 1100 1200" stroke-width="4" opacity=".45" />
        </g>
      </svg>

      <div class="poster__content poster--reunion__content">
        <!-- Masthead: our logo + org + presents -->
        <header class="poster--reunion__masthead">
          <div class="logo-container">
            <img
              src="../assets/logo/vlm-logo.svg"
              alt="VLM BDU Fellowship logo"
            />
          </div>
          <p class="poster--reunion__org">BDU Fellowship</p>
          <p class="poster--reunion__place">Addis Ababa</p>
        </header>

        <!-- Hero -->
        <section class="poster--reunion__hero">
          <p class="poster--reunion__eyebrow">BDU Fellowship</p>
          <h1 class="poster--reunion__title">Reunion</h1>
          <svg
            class="brush brush--wide"
            viewBox="0 0 560 14"
            aria-hidden="true"
          >
            <path
              d="M6 9 C 120 3, 440 3, 554 8 C 440 12, 120 12, 6 9 Z"
              fill="#fbbf24"
            />
          </svg>

          <p class="poster--reunion__anni">
            <span class="poster--reunion__one">1</span>
            <span class="poster--reunion__year">Year</span><br /><span
              class="poster--reunion__ann-word"
              >Anniversary</span
            >
          </p>
          <svg
            class="brush brush--narrow"
            viewBox="0 0 420 14"
            aria-hidden="true"
          >
            <path
              d="M6 9 C 90 3, 330 3, 414 8 C 330 12, 90 12, 6 9 Z"
              fill="#fbbf24"
            />
          </svg>
        </section>

        <!-- Date / time / Amharic date -->
        <section class="poster--reunion__info" aria-label="Date and time">
          <div class="poster--reunion__col">
            <img src="../assets/icons/material-symbols/event.svg" alt="" />
            <strong>Aug 30</strong>
            <span>Sunday</span>
          </div>
          <div class="poster--reunion__col">
            <img src="../assets/icons/material-symbols/schedule.svg" alt="" />
            <strong>8:00</strong>
            <span>Local Time</span>
          </div>
          <div class="poster--reunion__col">
            <img src="../assets/icons/material-symbols/event.svg" alt="" />
            <strong class="amharic">ነሐሴ 24</strong>
            <span class="amharic">እሁድ</span>
          </div>
        </section>

        <!-- Address -->
        <section class="poster--reunion__where">
          <img src="../assets/icons/material-symbols/location_on.svg" alt="" />
          <span class="poster--reunion__where-label">Address</span>
          <strong class="poster--reunion__where-name"
            >Mexico Emanuel Church</strong
          >
        </section>

        <!-- Closing verse -->
        <section class="poster--reunion__verse">
          <p class="poster--reunion__verse-text amharic">
            የረዳኝን እግዚአብሔርን አመሰግናለሁ፥ ለልዑል እግዚአብሔር ስምም እዘምራለሁ።
          </p>
          <p class="poster--reunion__verse-ref amharic">— መዝሙር 13፥6</p>
        </section>
      </div>
    </main>
  </body>
</html>
